# Secret Sentinel — CI for this repository.
#
# Every push and pull request: unit tests, a secret scan of the changed code
# and the new commits, and a Bandit scan for Python vulnerabilities. Weekly
# (and on demand): a full scan of all git history.
# The scan job fails on any NEW secret at/above `high` (override with the
# repository variable SECRET_SCAN_FAIL_ON); the Bandit job fails on issues of
# medium-or-higher severity and confidence. Make "Secret scan" (and the other
# checks) required in branch protection to block merges on them.

name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC: full-history audit
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the whole tree and every commit (not just recent changes)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suites
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          python3 -m tests.test_scanner
          python3 -m tests.test_pipeline_e2e
          python3 -m tests.test_history
          python3 -m tests.test_ci_and_alerts
          python3 -m tests.test_gating
          python3 -m tests.test_custom_rules
          python3 -m tests.test_hooks
          python3 -m tests.test_ci_runs

  # A separate job, so it always runs: a secret found by the Secret scan job
  # never stops the vulnerability scan (or the other way round).
  code-vulnerabilities:
    name: Code vulnerabilities (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit==1.9.4
      - name: Scan Python code for vulnerabilities
        run: |
          EXCLUDE=./tests,./.venv,./venv,./sentinel-results
          # Full report (every severity) for the artifact and the summary...
          bandit -r . -x "$EXCLUDE" -f json -o bandit-report.json --exit-zero -q
          python3 ci/bandit_summary.py bandit-report.json >> "$GITHUB_STEP_SUMMARY"
          # ...but only medium-or-higher severity AND confidence fails the build.
          bandit -r . -x "$EXCLUDE" -ll -ii
      - name: Keep the Bandit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write     # upload SARIF to code scanning
      actions: read
      pull-requests: write       # one comment on the PR with the findings
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # full history: needed for the history scan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scan code and git history
        env:
          SENTINEL_FAIL_ON: ${{ vars.SECRET_SCAN_FAIL_ON || 'high' }}
          SENTINEL_TIMEZONE: ${{ vars.SENTINEL_TIMEZONE || 'UTC' }}
          SENTINEL_FULL_HISTORY: ${{ github.event_name == 'schedule' || inputs.full_history == true }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Alert channels: each is used only when its secrets are set.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.SMTP_USER }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENTINEL_URL: ${{ vars.SENTINEL_URL }}
          SENTINEL_TOKEN: ${{ secrets.SENTINEL_TOKEN }}
        run: bash ci/github-scan.sh .

      # One comment on the pull request, updated on every push; silent on a
      # clean PR. Never fails the job. Turn off with SENTINEL_PR_COMMENT=false.
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && vars.SENTINEL_PR_COMMENT != 'false' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 ci/pr_comment.py sentinel-results/result.json

      # Findings also appear in Security -> Code scanning and inline on PRs.
      # Needs code scanning enabled (free on public repos; GitHub Advanced
      # Security on private ones), so it is opt-in: set the repository
      # variable SECRET_SCAN_UPLOAD_SARIF=true once it is. Never fails the job.
      - name: Upload code findings to code scanning
        if: ${{ !cancelled() && vars.SECRET_SCAN_UPLOAD_SARIF == 'true' && hashFiles('sentinel-results/code.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sentinel-results/code.sarif
          category: secret-sentinel-code

      - name: Upload history findings to code scanning
        if: ${{ !cancelled() && vars.SECRET_SCAN_UPLOAD_SARIF == 'true' && hashFiles('sentinel-results/history.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sentinel-results/history.sarif
          category: secret-sentinel-history

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: secret-scan-results
          path: sentinel-results/
          if-no-files-found: ignore
          retention-days: 30
