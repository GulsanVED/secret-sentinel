# Secret Sentinel — drop-in GitHub Actions workflow for OTHER repositories.
#
# Copy this file into the repo you want to protect, as
#   .github/workflows/secret-scan.yml
#
# On every push and pull request it scans the changed code AND the new commits
# for hard-coded secrets; weekly it audits the full git history. The job fails
# on any NEW finding at/above `high`, so make "Secret scan" a required status
# check (Settings -> Branches -> branch protection) to block merges.
#
# Findings show up as: a failed check, inline annotations on the PR diff, one
# comment on the PR, the job summary, a result artifact the Secret Sentinel
# dashboard reads ("CI runs" tab), Security -> Code scanning (SARIF), and
# email/Slack if set up.
#
# Setup:
#   Settings -> Secrets and variables -> Actions
#     Variables:  SENTINEL_REPO         owner/name of your Secret Sentinel copy
#                                       (default: ratnakarmishra712-jpg/hh)
#                 SECRET_SCAN_FAIL_ON   optional: none|low|medium|high|critical
#                 SECRET_SCAN_UPLOAD_SARIF  'true' once code scanning is enabled
#                 SENTINEL_BANDIT       'true' to also scan Python code for
#                                       vulnerabilities with Bandit (own job)
#                 SENTINEL_PR_COMMENT   'false' to turn off the PR comment
#     Secrets (all optional, per alert channel):
#                 SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, ALERT_EMAIL_TO
#                 SLACK_WEBHOOK_URL
#                 SENTINEL_TOKEN        (with variable SENTINEL_URL, to update a dashboard)
#                 SENTINEL_REPO_TOKEN   only if SENTINEL_REPO is private
#
# Known/accepted findings: commit a .sentinelignore or .sentinel-baseline.json
# to the protected repo (see the Secret Sentinel README).

name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write     # the PR comment
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch Secret Sentinel
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.SENTINEL_REPO || 'ratnakarmishra712-jpg/hh' }}
          token: ${{ secrets.SENTINEL_REPO_TOKEN || github.token }}
          path: .sentinel

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scan code and git history
        env:
          SENTINEL_FAIL_ON: ${{ vars.SECRET_SCAN_FAIL_ON || 'high' }}
          SENTINEL_TIMEZONE: ${{ vars.SENTINEL_TIMEZONE || 'UTC' }}
          SENTINEL_FULL_HISTORY: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
          SENTINEL_RESULTS_DIR: ${{ runner.temp }}/sentinel-results
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.SMTP_USER }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENTINEL_URL: ${{ vars.SENTINEL_URL }}
          SENTINEL_TOKEN: ${{ secrets.SENTINEL_TOKEN }}
        run: |
          # Move the tool out of the workspace so it isn't scanned itself.
          mv .sentinel "$RUNNER_TEMP/sentinel"
          bash "$RUNNER_TEMP/sentinel/ci/github-scan.sh" .

      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && vars.SENTINEL_PR_COMMENT != 'false' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 "$RUNNER_TEMP/sentinel/ci/pr_comment.py" "$RUNNER_TEMP/sentinel-results/result.json"

      # The dashboard's "CI runs" tab reads result.json from this artifact.
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: secret-scan-results
          path: ${{ runner.temp }}/sentinel-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload code findings to code scanning
        if: ${{ !cancelled() && vars.SECRET_SCAN_UPLOAD_SARIF == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/sentinel-results/code.sarif
          category: secret-sentinel-code

      - name: Upload history findings to code scanning
        if: ${{ !cancelled() && vars.SECRET_SCAN_UPLOAD_SARIF == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/sentinel-results/history.sarif
          category: secret-sentinel-history

  # Optional: Python vulnerability scan, in its own job so a secret finding
  # never stops it from running. Turn on with the SENTINEL_BANDIT variable.
  code-vulnerabilities:
    name: Code vulnerabilities (Bandit)
    if: ${{ vars.SENTINEL_BANDIT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Secret Sentinel
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.SENTINEL_REPO || 'ratnakarmishra712-jpg/hh' }}
          token: ${{ secrets.SENTINEL_REPO_TOKEN || github.token }}
          path: .sentinel

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scan Python code for vulnerabilities
        run: |
          mv .sentinel "$RUNNER_TEMP/sentinel"
          pip install bandit==1.9.4
          EXCLUDE=./tests,./.venv,./venv
          bandit -r . -x "$EXCLUDE" -f json -o "$RUNNER_TEMP/bandit-report.json" --exit-zero -q
          python3 "$RUNNER_TEMP/sentinel/ci/bandit_summary.py" "$RUNNER_TEMP/bandit-report.json" >> "$GITHUB_STEP_SUMMARY"
          bandit -r . -x "$EXCLUDE" -ll -ii
